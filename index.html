<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cookie World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">
    
    <div id="cookie-area">
      <div id="cookie">🍪</div>
      <p>Cookies: <span id="cookies">0</span></p>
    </div>

    <div id="upgrades">
      <h2>Upgrades</h2>
      <button onclick="buyUpgrade()">+1 por click (10)</button>
    </div>

    <div id="buildings">
      <h2>Construções</h2>
      <button onclick="buyCursor()">Cursor (50)</button>
    </div>

  </div>

  <div id="menu">
    <button onclick="saveGame()">Salvar</button>
    <button onclick="loadGame()">Carregar</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
